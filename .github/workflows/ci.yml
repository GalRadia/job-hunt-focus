name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Ready-to-upload Chrome Web Store package (extension/ incl. compiled js/)
      - run: cd extension && zip -qr ../job-hunt-focus.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: job-hunt-focus
          path: job-hunt-focus.zip
