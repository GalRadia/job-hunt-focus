name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

# Least privilege: the job only reads the repo and uploads an artifact.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the comment shows the version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      # End-to-end: the real extension in Chrome for Testing, against a local fake internet
      - run: npm run e2e:setup
      # Ubuntu 23.10+ (ubuntu-latest) blocks unprivileged user namespaces via AppArmor, which Chrome's sandbox
      # needs ("No usable sandbox!"). Lift that restriction on this throwaway runner instead of using --no-sandbox,
      # so the tests still run with Chrome's sandbox on.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:e2e
      # Ready-to-upload Chrome Web Store package (extension/ incl. compiled js/)
      - run: cd extension && zip -qr ../job-hunt-focus.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: job-hunt-focus
          path: job-hunt-focus.zip
