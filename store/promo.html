<!doctype html>
<!-- 440x280 Chrome Web Store small promo tile. Rendered by tools/screenshots.mjs. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promo tile</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    html, body { width: 440px; height: 280px; overflow: hidden; }
    body { background: var(--evergreen); color: var(--on-color); padding: 34px 36px; display: grid; align-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; }
    .brand img { width: 40px; height: 40px; margin: -5px; } /* icon-128 has 16/128 transparent padding */
    h1 { margin: 0; font-size: 40px; font-weight: 740; line-height: 1.02; letter-spacing: -.04em; }
    p { margin: 10px 0 0; font-size: 15px; opacity: .8; }
  </style>
</head>
<body>
  <div class="brand"><img src="/icons/icon-128.png" alt="">Job Hunt Focus</div>
  <div>
    <h1>Block distractions.<br>Track every application.</h1>
    <p>Focus sessions, a job tracker and daily goals.</p>
  </div>
</body>
</html>
