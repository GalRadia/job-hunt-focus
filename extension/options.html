<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Hunt Focus Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <form id="form" class="page">
    <h1>Settings</h1>
    <p class="lede">Sites are only blocked while a focus session is running.</p>
    <label class="field"><span>Distracting sites</span>
      <small>Blocked in “Block distractions” mode. One site per line.</small>
      <textarea id="blocklist" spellcheck="false"></textarea>
    </label>
    <label class="field"><span>Job-search sites</span>
      <small>The only sites allowed in “Job sites only” mode. Subdomains are included.</small>
      <textarea id="allowlist" spellcheck="false"></textarea>
    </label>
    <div class="numbers">
      <label class="field"><span>Focus minutes</span><input id="focusMin" type="number" min="1"></label>
      <label class="field"><span>Break minutes</span><input id="breakMin" type="number" min="1"></label>
      <label class="field"><span>Daily goal</span><input id="dailyGoal" type="number" min="1"></label>
    </div>
    <label class="field"><span>Check job postings every (minutes)</span>
      <small>Postings you're watching are checked in the background and marked Closed when they're taken down.</small>
      <input id="watchEveryMin" type="number" min="30" step="30" style="max-width: 180px">
    </label>
    <div class="actions">
      <button class="primary">Save settings</button>
      <span id="saved" class="muted" role="status" hidden>Settings saved</span>
    </div>
  </form>
  <script type="module" src="js/options.js"></script>
</body>
</html>
