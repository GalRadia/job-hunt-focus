<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Hunt Focus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup" data-phase="idle">
  <section class="hero" aria-live="polite">
    <header class="hero-top">
      <span class="brand">Job Hunt Focus</span>
      <button id="options" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </header>
    <p id="phase-label" class="phase-label">Ready when you are</p>
    <div id="clock" class="clock">25:00</div>
    <div class="track" aria-hidden="true"><div id="progress"></div></div>
    <div class="controls">
      <button id="start" class="primary">Start focus</button>
      <button id="stop" class="ghost" hidden>End session</button>
    </div>
    <fieldset class="segmented">
      <legend class="sr-only">What to block during focus</legend>
      <label><input type="radio" name="mode" value="blocklist"><span>Block distractions</span></label>
      <label><input type="radio" name="mode" value="allowlist"><span>Job sites only</span></label>
    </fieldset>
  </section>

  <section class="today">
    <div class="today-row">
      <p><strong id="goal-count">0 of 5</strong> done today</p>
      <div id="pips" class="pips" role="img"></div>
    </div>
    <p id="streak" class="muted small"></p>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="todos" aria-selected="true">Todos <span id="todo-count" class="count"></span></button>
    <button role="tab" data-tab="sessions" aria-selected="false">Sessions</button>
  </nav>

  <main>
    <section id="todos" class="pane">
      <form id="todo-form" class="add">
        <input id="todo-text" type="text" placeholder="Add a task" aria-label="New task" autocomplete="off">
        <button class="primary small-btn">Add</button>
      </form>
      <button id="save-job" class="wide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        Save this tab as a job to apply for
      </button>
      <ul id="todo-list" class="list"></ul>
      <p id="todo-empty" class="empty" hidden>Nothing queued. Open a job posting and save it here, or add a task above.</p>
      <button id="clear-done" class="link-btn" hidden>Clear finished</button>
    </section>

    <section id="sessions" class="pane" hidden>
      <form id="session-form" class="add">
        <input id="session-name" type="text" placeholder="Name this window" aria-label="Session name" autocomplete="off">
        <button class="primary small-btn">Save window</button>
      </form>
      <ul id="session-list" class="list"></ul>
      <p id="session-empty" class="empty" hidden>Save your open tabs as a session to pick up exactly where you left off.</p>
    </section>
  </main>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
